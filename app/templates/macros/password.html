{#- Botão com o ícone de olho para mostrar ou esconder a palavra-passe de um campo.
    Começa escondido e só aparece se o JavaScript estiver ativo (app/static/password-toggle.js). -#}
{% macro toggle(field_id) -%}
<button type="button" class="password-toggle" data-toggle-password="{{ field_id }}"
        aria-controls="{{ field_id }}" aria-pressed="false"
        aria-label="{{ texts.SHOW_PASSWORD }}" title="{{ texts.SHOW_PASSWORD }}"
        data-label-show="{{ texts.SHOW_PASSWORD }}" data-label-hide="{{ texts.HIDE_PASSWORD }}" hidden>
  <svg class="icon-show" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
  </svg>
  <svg class="icon-hide" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
    <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-3.2 4.2M6.6 6.6C3.4 8.6 1 12 1 12s4 7 11 7a10.6 10.6 0 0 0 5.4-1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
{%- endmacro %}
