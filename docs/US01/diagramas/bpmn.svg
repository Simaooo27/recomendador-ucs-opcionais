<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 560" width="1580" height="560" font-family="Arial, Helvetica, sans-serif">
<title>BPMN — US01 Registo com email institucional</title>
<desc>Processo de registo: o aluno preenche o formulário, o sistema valida, cria uma conta inativa e envia um email; o aluno abre a ligação e o sistema ativa a conta.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22242a"/></marker></defs>
<rect width="1580" height="560" fill="#ffffff"/>
<rect x="40" y="40" width="1500" height="480" fill="#ffffff" stroke="#22242a" stroke-width="2"/>
<line x1="70" y1="40" x2="70" y2="520" stroke="#22242a" stroke-width="2"/>
<g transform="translate(55,280.0) rotate(-90)"><text x="0" y="0.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1b2430">US01 — Registo</text></g>
<rect x="70" y="40" width="1470" height="200" fill="#f6f9fe" stroke="#22242a" stroke-width="1.5"/>
<g transform="translate(84,140.0) rotate(-90)"><text x="0" y="0.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1b2430">Aluno</text></g>
<rect x="70" y="240" width="1470" height="280" fill="#fafafa" stroke="#22242a" stroke-width="1.5"/>
<g transform="translate(84,380.0) rotate(-90)"><text x="0" y="0.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1b2430">Sistema</text></g>
<polyline points="146,140 190,140" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="320,140 350,140 350,330 380,330" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="510,330 560,330" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="610,330 670,330" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="627" y="310" width="30" height="16" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="642" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#22242a">sim</text>
<polyline points="585,355 585,410" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="589" y="377" width="30" height="16" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="604" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#22242a">não</text>
<polyline points="520,445 255,445 255,180" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="800,330 850,330" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="980,330 1005,330 1005,140 1030,140" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="1095,180 1095,290" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="1160,330 1210,330" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="1260,330 1310,330" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1272" y="310" width="30" height="16" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="1287" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#22242a">sim</text>
<polyline points="1440,330 1470,330" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="1235,355 1235,420" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1239" y="384" width="30" height="16" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="1254" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#22242a">não</text>
<polyline points="1300,455 1340,455" fill="none" stroke="#22242a" stroke-width="1.8" marker-end="url(#arr)"/>
<circle cx="128.0" cy="140.0" r="18.0" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
<text x="128.0" y="175.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2430">Quer criar conta</text>
<rect x="190" y="100" width="130" height="80" rx="10" fill="#e6effb" stroke="#22242a" stroke-width="2"/>
<text x="255.0" y="124.4" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">Preencher o</text>
<text x="255.0" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">formulário de</text>
<text x="255.0" y="155.6" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">registo</text>
<rect x="380" y="290" width="130" height="80" rx="10" fill="#f1f2f4" stroke="#22242a" stroke-width="2"/>
<text x="445.0" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">Validar os dados</text>
<polygon points="585.0,305 610,330.0 585.0,355 560,330.0" fill="#ffffff" stroke="#22242a" stroke-width="2"/>
<path d="M576.0,321.0 L594.0,339.0 M594.0,321.0 L576.0,339.0" stroke="#22242a" stroke-width="3" fill="none"/>
<text x="585.0" y="286.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2430">Dados válidos?</text>
<rect x="520" y="410" width="130" height="70" rx="10" fill="#f1f2f4" stroke="#22242a" stroke-width="2"/>
<text x="585.0" y="437.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">Mostrar os erros</text>
<text x="585.0" y="452.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">no formulário</text>
<rect x="670" y="290" width="130" height="80" rx="10" fill="#f1f2f4" stroke="#22242a" stroke-width="2"/>
<text x="735.0" y="314.4" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">Criar conta</text>
<text x="735.0" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">inativa com hash</text>
<text x="735.0" y="345.6" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">da palavra-passe</text>
<rect x="850" y="290" width="130" height="80" rx="10" fill="#f1f2f4" stroke="#22242a" stroke-width="2"/>
<text x="915.0" y="322.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">Enviar email de</text>
<text x="915.0" y="337.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">confirmação</text>
<rect x="1030" y="100" width="130" height="80" rx="10" fill="#e6effb" stroke="#22242a" stroke-width="2"/>
<text x="1095.0" y="132.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">Abrir a ligação do</text>
<text x="1095.0" y="147.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">email</text>
<rect x="1030" y="290" width="130" height="80" rx="10" fill="#f1f2f4" stroke="#22242a" stroke-width="2"/>
<text x="1095.0" y="314.4" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">Validar a ligação</text>
<text x="1095.0" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">(assinatura e</text>
<text x="1095.0" y="345.6" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">prazo)</text>
<polygon points="1235.0,305 1260,330.0 1235.0,355 1210,330.0" fill="#ffffff" stroke="#22242a" stroke-width="2"/>
<path d="M1226.0,321.0 L1244.0,339.0 M1244.0,321.0 L1226.0,339.0" stroke="#22242a" stroke-width="3" fill="none"/>
<text x="1235.0" y="286.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2430">Ligação válida?</text>
<rect x="1310" y="290" width="130" height="80" rx="10" fill="#f1f2f4" stroke="#22242a" stroke-width="2"/>
<text x="1375.0" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">Ativar a conta</text>
<circle cx="1488.0" cy="330.0" r="18.0" fill="#ffffff" stroke="#b71c1c" stroke-width="4.5"/>
<text x="1488.0" y="365.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2430">Conta ativa</text>
<rect x="1170" y="420" width="130" height="70" rx="10" fill="#f1f2f4" stroke="#22242a" stroke-width="2"/>
<text x="1235.0" y="447.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">Informar que a</text>
<text x="1235.0" y="462.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#1b2430">ligação falhou</text>
<circle cx="1358.0" cy="455.0" r="18.0" fill="#ffffff" stroke="#b71c1c" stroke-width="4.5"/>
<text x="1358.0" y="483.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2430">Ligação inválida</text>
<text x="1358.0" y="498.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2430">ou expirada</text>
<rect x="60" y="526" width="18" height="12" rx="3" fill="#e6effb" stroke="#22242a"/><text x="86" y="532" dominant-baseline="central" font-size="12" fill="#1b2430">Tarefa do aluno</text>
<rect x="200" y="526" width="18" height="12" rx="3" fill="#f1f2f4" stroke="#22242a"/><text x="226" y="532" dominant-baseline="central" font-size="12" fill="#1b2430">Tarefa automática do sistema</text>
</svg>
