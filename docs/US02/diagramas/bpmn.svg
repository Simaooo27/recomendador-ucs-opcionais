<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1530 690" width="1530" height="690" font-family="Arial, Helvetica, sans-serif"><title>BPMN US02 — Autenticação</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#000000" stroke-width="1.5"/></marker></defs><rect width="1530" height="690" fill="#fff"/><rect x="30" y="20" width="1480" height="650" fill="none" stroke="#000000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="670" stroke="#000000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="670" stroke="#000000" stroke-width="1.5"/><text transform="translate(45,345.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#000000">US02 — Autenticação</text><text transform="translate(75,130.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#000000">Aluno</text><line x1="60" y1="240" x2="1510" y2="240" stroke="#000000" stroke-width="1.5"/><text transform="translate(75,455.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#000000">Sistema</text><circle cx="150" cy="130" r="18" fill="#fff" stroke="#000000" stroke-width="2"/><text x="150" y="168.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="normal" fill="#000000">Quer entrar</text><rect x="205.0" y="98.0" width="130" height="64" rx="9" fill="#fff" stroke="#000000" stroke-width="2"/><text x="270" y="122.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Indicar email e</text><text x="270" y="137.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">palavra-passe</text><rect x="365.0" y="348.0" width="130" height="64" rx="9" fill="#fff" stroke="#000000" stroke-width="2"/><text x="430" y="372.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Validar o pedido</text><text x="430" y="387.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">e as credenciais</text><path d="M560,354 L586,380 L560,406 L534,380 z" fill="#fff" stroke="#000000" stroke-width="2"/><path d="M551,371 L569,389 M569,371 L551,389" stroke="#000000" stroke-width="3"/><text x="560" y="324.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Credenciais</text><text x="560" y="339.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">corretas?</text><path d="M690,354 L716,380 L690,406 L664,380 z" fill="#fff" stroke="#000000" stroke-width="2"/><path d="M681,371 L699,389 M699,371 L681,389" stroke="#000000" stroke-width="3"/><text x="690" y="338.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Conta ativa?</text><rect x="775.0" y="348.0" width="130" height="64" rx="9" fill="#fff" stroke="#000000" stroke-width="2"/><text x="840" y="380.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Criar nova sessão</text><rect x="925.0" y="348.0" width="130" height="64" rx="9" fill="#fff" stroke="#000000" stroke-width="2"/><text x="990" y="372.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Mostrar a página</text><text x="990" y="387.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">inicial</text><rect x="1095.0" y="98.0" width="130" height="64" rx="9" fill="#fff" stroke="#000000" stroke-width="2"/><text x="1160" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Usar a aplicação</text><rect x="1255.0" y="98.0" width="130" height="64" rx="9" fill="#fff" stroke="#000000" stroke-width="2"/><text x="1320" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Terminar sessão</text><rect x="1255.0" y="348.0" width="130" height="64" rx="9" fill="#fff" stroke="#000000" stroke-width="2"/><text x="1320" y="380.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Apagar a sessão</text><circle cx="1450" cy="380" r="18" fill="#fff" stroke="#000000" stroke-width="4"/><text x="1450" y="418.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="normal" fill="#000000">Sessão terminada</text><rect x="495.0" y="498.0" width="130" height="64" rx="9" fill="#fff" stroke="#000000" stroke-width="2"/><text x="560" y="522.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Mostrar mensagem</text><text x="560" y="537.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">genérica de erro</text><rect x="625.0" y="588.0" width="130" height="64" rx="9" fill="#fff" stroke="#000000" stroke-width="2"/><text x="690" y="612.2" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">Pedir para</text><text x="690" y="627.8" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" font-style="normal" fill="#000000">confirmar o email</text><circle cx="830" cy="620" r="18" fill="#fff" stroke="#00