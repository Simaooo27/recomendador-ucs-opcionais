<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Arial, Helvetica, sans-serif"><title>Use case US03</title><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#000000" stroke-width="1.5"/></marker></defs><rect width="1000" height="560" fill="#fff"/><rect x="230" y="28" width="560" height="500" rx="8" fill="#fff" stroke="#000000" stroke-width="2"/><text x="510" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" font-style="normal" fill="#000000">Sistema: Recomendador de UCs opcionais</text><g stroke="#000000" stroke-width="2.4" fill="none"><circle cx="110" cy="80" r="20"/><line x1="110" y1="100" x2="110" y2="158"/><line x1="72" y1="122" x2="148" y2="122"/><line x1="110" y1="158" x2="78" y2="200"/><line x1="110" y1="158" x2="142" y2="200"/></g><text x="110" y="221.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" font-style="normal" fill="#000000">Equipa</text><text x="110" y="238.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" font-style="normal" fill="#000000">(instala a aplicação)</text><g stroke="#000000" stroke-width="2.4" fill="none"><circle cx="110" cy="330" r="20"/><line x1="110" y1="350" x2="110" y2="408"/><line x1="72" y1="372" x2="148" y2="372"/><line x1="110" y1="408" x2="78" y2="450"/><line x1="110" y1="408" x2="142" y2="450"/></g><text x="110" y="480.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" font-style="normal" fill="#000000">Administrador</text><ellipse cx="380" cy="140" rx="118" ry="46" fill="#fff" stroke="#000000" stroke-width="2.4"/><text x="380" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="normal" fill="#000000">UC05</text><text x="380" y="151.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" font-style="normal" fill="#000000">Criar 1.º administrador</text><ellipse cx="380" cy="290" rx="118" ry="46" fill="#fff" stroke="#000000" stroke-width="2.4"/><text x="380" y="277.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="normal" fill="#000000">UC06</text><text x="380" y="301.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" font-style="normal" fill="#000000">Entrar na gestão</text><ellipse cx="380" cy="440" rx="118" ry="46" fill="#fff" stroke="#000000" stroke-width="2.4"/><text x="380" y="427.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="normal" fill="#000000">UC07</text><text x="380" y="451.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" font-style="normal" fill="#000000">Gerir administradores</text><ellipse cx="670" cy="215" rx="105" ry="46" fill="#fff" stroke="#000000" stroke-width="2.4"/><text x="670" y="206.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" font-style="normal" fill="#000000">Validar nome e</text><text x="670" y="223.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" font-style="normal" fill="#000000">palavra-passe</text><ellipse cx="670" cy="440" rx="105" ry="46" fill="#fff" stroke="#000000" stroke-width="2.4"/><text x="670" y="431.2" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" font-style="normal" fill="#000000">Verificar a sessão</text><text x="670" y="448.8" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" font-style="normal" fill="#000000">de administrador</text><line x1="150" y1="130" x2="262" y2="140" stroke="#000000" stroke-width="1.8"/><line x1="150" y1="380" x2="262" y2="295" stroke="#000000" stroke-width="1.8"/><line x1="150" y1="380" x2="262" y2="435" stroke="#000000" stroke-width="1.8"/><line x1="490" y1="160" x2="575" y2="195" stroke="#000000" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#o)"/><text x="545" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="italic" fill="#000000">«include»</text><line x1="495" y1="280" x2="568" y2="232" stroke="#000000" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#o)"/><text x="512" y="228.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="italic" fill="#000000">«include»</text><line x1="470" y1="412" x2="600" y2="255" stroke="#000000" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#o)"/><text x="585" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="italic" fill="#000000">«include»</text><line x1="498" y1="450" x2="565" y2="450" stroke="#000000" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#o)"/><text x="532" y="470.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="italic" fill="#000000">«include»</text><text x="510" y="505.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" font-style="italic" fill="#000000">Os administradores não usam as contas dos alunos nem aparecem nas páginas dos alunos.</text></svg>