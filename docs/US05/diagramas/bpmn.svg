<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" width="1150" height="640" font-family="Arial, Helvetica, sans-serif"><title>BPMN US05 — Consultar e comparar cursos</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="640" fill="#fff"/><rect x="30" y="20" width="1100" height="600" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="620" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="620" stroke="#000" stroke-width="1.5"/><text transform="translate(45,320.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Consultar e comparar cursos (US05)</text><text transform="translate(75,160.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Pessoa (com ou sem sessão)</text><line x1="60" y1="300" x2="1130" y2="300" stroke="#000" stroke-width="1.5"/><text transform="translate(75,460.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="148,110 185,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="260,142 260,368" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="335,400 375,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="450,368 450,235" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="475,210 640,210 640,142" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="489" y="200" font-size="11" font-style="italic">comparar</text><polyline points="425,210 355,210 355,545 335,545" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="417" y="200" text-anchor="end" font-size="11" font-style="italic">ver um curso</text><polyline points="715,110 800,110 800,375" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="825,400 885,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="839" y="390" font-size="11" font-style="italic">sim</text><polyline points="800,425 800,513" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="808" y="439" font-size="11" font-style="italic">não</text><polyline points="725,545 690,545 690,142" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="960,432 960,512" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="185,545 158,545" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="130" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="130" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre o</text><text x="130" y="154.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">catálogo</text><text x="130" y="168.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">(/cursos/)</text><rect x="185.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="260" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Escolher área,</text><text x="260" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">instituição ou</text><text x="260" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">localidade e aplicar</text><rect x="185.0" y="368.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="260" y="392.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Filtrar o catálogo com</text><text x="260" y="407.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">os valores do endereço</text><rect x="375.0" y="368.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="450" y="385.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar as fichas que</text><text x="450" y="400.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">correspondem e quantas</text><text x="450" y="415.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">são</text><polygon points="450,185 475,210 450,235 425,210" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="450" y="210" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="481" y="164.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Comparar ou ver um</text><text x="481" y="178.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">curso?</text><rect x="565.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="640" y="102.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Marcar 2 ou 3 cursos e</text><text x="640" y="117.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">carregar em «Comparar»</text><polygon points="800,375 825,400 800,425 775,400" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="800" y="400" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="831" y="354.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">2 ou 3 cursos do</text><text x="831" y="368.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">catálogo?</text><rect x="885.0" y="368.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="960" y="392.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar os cursos lado</text><text x="960" y="407.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">a lado</text><circle cx="960" cy="530" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="986" y="516.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Escolhe um curso</text><text x="986" y="530.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">(US31) ou volta ao</text><text x="986" y="544.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">catálogo</text><rect x="725.0" y="513.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="800" y="537.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Avisar: escolha pelo</text><text x="800" y="552.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">menos 2 cursos</text><rect x="185.0" y="513.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="260" y="530.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar a ficha</text><text x="260" y="545.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">completa: descrição,</text><text x="260" y="560.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">saídas, dados e fontes</text><circle cx="140" cy="545" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="140" y="575.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Escolhe o</text><text x="140" y="589.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">curso (US31)</text><text x="140" y="603.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">ou compara</text></svg>