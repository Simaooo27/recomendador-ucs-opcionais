<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="1150" height="560" font-family="Arial, Helvetica, sans-serif"><title>BPMN US17 — Apagar a minha conta</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="560" fill="#fff"/><rect x="30" y="20" width="1100" height="520" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="540" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="540" stroke="#000" stroke-width="1.5"/><text transform="translate(45,280.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Apagar a minha conta (US17)</text><text transform="translate(75,140.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno (com sessão)</text><line x1="60" y1="260" x2="1130" y2="260" stroke="#000" stroke-width="1.5"/><text transform="translate(75,400.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="143,110 185,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="260,142 260,348" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="335,380 395,380 395,110 405,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="480,142 480,355" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="505,380 585,380" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="519" y="370" font-size="11" font-style="italic">sim</text><polyline points="480,405 480,448" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="488" y="419" font-size="11" font-style="italic">não</text><polyline points="405,480 360,480 360,165 445,165 445,142" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="735,380 765,380" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="915,380 952,380" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="555,110 605,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="569.0" y="100" font-size="11" font-style="italic">ou</text><polyline points="755,110 822,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="125" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="125" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Em «A minha</text><text x="125" y="154.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">conta»</text><rect x="185.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="260" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Carregar em «Apagar a</text><text x="260" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">minha conta e todos os</text><text x="260" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">meus dados»</text><rect x="185.0" y="348.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="260" y="365.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar o que vai ser</text><text x="260" y="380.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">apagado e pedir a</text><text x="260" y="395.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">palavra-passe</text><rect x="405.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="480" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Escrever a</text><text x="480" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">palavra-passe e</text><text x="480" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">confirmar</text><polygon points="480,355 505,380 480,405 455,380" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="480" y="380" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="511" y="341.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Palavra-passe certa?</text><rect x="585.0" y="348.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="660" y="365.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Apagar a conta, a</text><text x="660" y="380.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">conversa, as decisões</text><text x="660" y="395.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">e os pedidos ao LLM</text><rect x="765.0" y="348.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="840" y="365.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Terminar a sessão e</text><text x="840" y="380.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">avisar na página de</text><text x="840" y="395.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">apresentação</text><circle cx="970" cy="380" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="996" y="380.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Conta e dados apagados</text><rect x="405.0" y="448.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="480" y="465.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Avisar que a</text><text x="480" y="480.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">palavra-passe não está</text><text x="480" y="495.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">certa (nada é apagado)</text><rect x="605.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="680" y="102.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Cancelar e voltar à</text><text x="680" y="117.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">conta</text><circle cx="840" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="866" y="110.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Nada muda</text></svg>