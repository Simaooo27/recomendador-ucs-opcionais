<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Arial, Helvetica, sans-serif"><title>BPMN US29 — Conversa de orientação com o LLM</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1600" height="700" fill="#fff"/><rect x="30" y="20" width="1550" height="660" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="680" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="680" stroke="#000" stroke-width="1.5"/><text transform="translate(45,350) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Conversa de orientação (US29)</text><text transform="translate(75,110.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno</text><line x1="60" y1="200" x2="1580" y2="200" stroke="#000" stroke-width="1.5"/><text transform="translate(75,365.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><line x1="60" y1="530" x2="1580" y2="530" stroke="#000" stroke-width="1.5"/><text transform="translate(75,605.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">LLM (fornecedor externo)</text><polyline points="148,110 185,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="335,110 440,110 440,248" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="440,312 440,573" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="515,605 540,605 540,280 595,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="620,305 620,358" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="628" y="319" font-size="11" font-style="italic">não</text><polyline points="620,422 620,452" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="645,280 755,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="659" y="270" font-size="11" font-style="italic">sim</text><polyline points="780,305 780,372" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="788" y="319" font-size="11" font-style="italic">sugestão</text><polyline points="805,280 865,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="819" y="270" font-size="11" font-style="italic">pergunta</text><polyline points="940,248 940,142" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1015,110 1110,110 1110,248" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1185,280 1255,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1305,280 1375,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="1319" y="270" font-size="11" font-style="italic">sim</text><polyline points="1450,312 1450,510 350,510 350,280 365,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1280,305 1280,510 350,510 350,280 365,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="1288" y="319" font-size="11" font-style="italic">não</text><circle cx="130" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="130" y="144.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abrir a conversa</text><rect x="185.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="260" y="102.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Carregar em «Começar a</text><text x="260" y="117.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">conversa»</text><rect x="365.0" y="248.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="440" y="265.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Enviar instruções,</text><text x="440" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">catálogo e conversa</text><text x="440" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">(sem dados pessoais)</text><rect x="365.0" y="573.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="440" y="590.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Gerar a próxima</text><text x="440" y="605.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">pergunta ou a sugestão</text><text x="440" y="620.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">(JSON)</text><polygon points="620,255 645,280 620,305 595,280" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="620" y="280" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="620" y="239.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Resposta válida?</text><rect x="545.0" y="358.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="620" y="375.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar o erro (a</text><text x="620" y="390.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">conversa fica</text><text x="620" y="405.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">guardada)</text><circle cx="620" cy="470" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="594" y="463.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">À espera de</text><text x="594" y="477.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">«Tentar de novo»</text><polygon points="780,255 805,280 780,305 755,280" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="780" y="280" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="780" y="239.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Pergunta ou sugestão?</text><circle cx="780" cy="390" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="858" y="383.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Conversa terminada</text><text x="858" y="397.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">(cursos na US30)</text><rect x="865.0" y="248.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="940" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar a pergunta</text><rect x="865.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="940" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Escrever a resposta</text><rect x="1035.0" y="248.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1110" y="265.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Validar, apagar emails</text><text x="1110" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">e números e guardar a</text><text x="1110" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">resposta</text><polygon points="1280,255 1305,280 1280,305 1255,280" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1280" y="280" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="1280" y="239.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">6 respostas?</text><rect x="1375.0" y="248.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1450" y="272.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Exigir a sugestão nas</text><text x="1450" y="287.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">instruções</text></svg>