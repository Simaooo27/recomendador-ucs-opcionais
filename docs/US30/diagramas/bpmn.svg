<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" width="1150" height="700" font-family="Arial, Helvetica, sans-serif"><title>BPMN US30 — Sugestão de 2 a 3 cursos</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="700" fill="#fff"/><rect x="30" y="20" width="1100" height="660" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="680" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="680" stroke="#000" stroke-width="1.5"/><text transform="translate(45,350) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Sugestão de cursos (US30)</text><text transform="translate(75,110.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno</text><line x1="60" y1="200" x2="1130" y2="200" stroke="#000" stroke-width="1.5"/><text transform="translate(75,365.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><line x1="60" y1="530" x2="1130" y2="530" stroke="#000" stroke-width="1.5"/><text transform="translate(75,605.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">LLM (fornecedor externo)</text><polyline points="148,110 215,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="290,142 290,248" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="290,312 290,573" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="365,605 395,605 395,280 425,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="575,280 635,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="685,280 755,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="699" y="270" font-size="11" font-style="italic">sim</text><polyline points="660,305 660,398" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="668" y="319" font-size="11" font-style="italic">não</text><polyline points="830,248 830,142" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="905,110 982,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="735,430 812,430" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="130" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="130" y="137.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Conversa a</text><text x="130" y="151.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">decorrer (US29)</text><rect x="215.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="290" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Carregar em «Ver</text><text x="290" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">sugestões já» ou dar a</text><text x="290" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">6.ª resposta</text><rect x="215.0" y="248.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="290" y="265.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Exigir a sugestão nas</text><text x="290" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">instruções e enviar a</text><text x="290" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">conversa</text><rect x="215.0" y="573.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="290" y="590.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Escolher 2 a 3 cursos</text><text x="290" y="605.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">do catálogo e explicar</text><text x="290" y="620.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">porquê (JSON)</text><rect x="425.0" y="248.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="500" y="265.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Descartar cursos fora</text><text x="500" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">do catálogo (RN09) e</text><text x="500" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">guardar</text><polygon points="660,255 685,280 660,305 635,280" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="660" y="280" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="660" y="239.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">2 ou mais cursos?</text><rect x="755.0" y="248.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="830" y="265.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar os cursos:</text><text x="830" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">dados do catálogo e</text><text x="830" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">explicação</text><rect x="755.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="830" y="102.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Comparar os cursos</text><text x="830" y="117.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">sugeridos</text><circle cx="1000" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="1026" y="103.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Escolha do curso</text><text x="1026" y="117.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">(US31)</text><rect x="585.0" y="398.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="660" y="415.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Avisar e propor</text><text x="660" y="430.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">continuar a conversa</text><text x="660" y="445.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">ou ver o catálogo</text><circle cx="830" cy="430" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="856" y="416.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Continua a conversa</text><text x="856" y="430.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">(US29) ou procura no</text><text x="856" y="444.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">catálogo</text></svg>