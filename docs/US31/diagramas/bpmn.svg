<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="Arial, Helvetica, sans-serif"><title>BPMN US31 — Escolher curso e linha do tempo</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1400" height="700" fill="#fff"/><rect x="30" y="20" width="1350" height="660" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="680" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="680" stroke="#000" stroke-width="1.5"/><text transform="translate(45,350) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Escolher curso (US31)</text><text transform="translate(75,140.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno</text><line x1="60" y1="260" x2="1380" y2="260" stroke="#000" stroke-width="1.5"/><text transform="translate(75,470.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="158,150 215,150" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="290,182 290,388" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="365,420 395,420 395,150 425,150" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="475,150 552,150" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="489" y="140" font-size="11" font-style="italic">não</text><polyline points="450,175 450,420 575,420" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="458" y="189" font-size="11" font-style="italic">sim</text><polyline points="600,445 600,528" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="608" y="459" font-size="11" font-style="italic">sim</text><polyline points="675,560 742,560" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="625,420 705,420" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="639" y="410" font-size="11" font-style="italic">não</text><polyline points="855,420 885,420" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1035,420 1045,420" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1120,388 1120,182" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1195,150 1237,150" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="140" cy="150" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="140" y="176.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Vê os cursos</text><text x="140" y="190.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">sugeridos (US30)</text><text x="140" y="204.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">ou o catálogo</text><rect x="215.0" y="118.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="290" y="142.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Carregar em «Escolher</text><text x="290" y="157.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">este curso»</text><rect x="215.0" y="388.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="290" y="405.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar a confirmação</text><text x="290" y="420.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">(curso atual e aviso</text><text x="290" y="435.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">sobre a conversa)</text><polygon points="450,125 475,150 450,175 425,150" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="450" y="150" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="450" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Confirma?</text><circle cx="570" cy="150" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="596" y="143.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Volta sem</text><text x="596" y="157.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">escolher</text><polygon points="600,395 625,420 600,445 575,420" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="600" y="420" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="600" y="379.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Já é o curso atual?</text><rect x="525.0" y="528.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="600" y="552.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Avisar que já é o seu</text><text x="600" y="567.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">curso</text><circle cx="760" cy="560" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="786" y="560.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Sem decisão nova</text><rect x="705.0" y="388.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="780" y="405.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Registar a decisão:</text><text x="780" y="420.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">data, sugeridos,</text><text x="780" y="435.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">escolhido e origem</text><rect x="885.0" y="388.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="960" y="412.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Apagar a conversa com</text><text x="960" y="427.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">o LLM (ponto 15)</text><rect x="1045.0" y="388.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1120" y="412.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar a linha do</text><text x="1120" y="427.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">tempo</text><rect x="1045.0" y="118.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1120" y="142.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ver as decisões (mais</text><text x="1120" y="157.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">recente primeiro)</text><circle cx="1255" cy="150" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="1281" y="143.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Curso no perfil</text><text x="1281" y="157.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">(RF03)</text></svg>