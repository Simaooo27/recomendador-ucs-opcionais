<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="1050" height="560" font-family="Arial, Helvetica, sans-serif"><title>BPMN US33 — Condições de acesso na ficha do curso</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1050" height="560" fill="#fff"/><rect x="30" y="20" width="1000" height="520" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="540" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="540" stroke="#000" stroke-width="1.5"/><text transform="translate(45,280.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Condições de acesso na ficha do curso (US33)</text><text transform="translate(75,125.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Pessoa (com ou sem sessão)</text><line x1="60" y1="230" x2="1030" y2="230" stroke="#000" stroke-width="1.5"/><text transform="translate(75,385.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="150,128 150,330 205,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="355,330 435,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="485,330 585,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="499" y="320" font-size="11" font-style="italic">sim</text><polyline points="460,355 460,470 585,470" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="466" y="450" font-size="11" font-style="italic">não</text><polyline points="735,330 860,330 860,128" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="735,470 842,470" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="66.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre a ficha de</text><text x="150" y="80.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">um curso</text><rect x="205.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="280" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ler as condições de</text><text x="280" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">acesso do curso no</text><text x="280" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">catálogo</text><polygon points="460,305 485,330 460,355 435,330" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="460" y="330" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="491" y="284.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">A DGES publica as</text><text x="491" y="298.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">condições?</text><rect x="585.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="660" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar provas,</text><text x="660" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">fórmula, mínimos e</text><text x="660" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">pré-requisitos</text><rect x="585.0" y="438.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="660" y="455.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar que não há</text><text x="660" y="470.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">dados e a ligação para</text><text x="660" y="485.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">a DGES</text><circle cx="860" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="886" y="103.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Sabe o que precisa</text><text x="886" y="117.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">para entrar</text><circle cx="860" cy="470" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="886" y="463.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Consulta a página da</text><text x="886" y="477.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">DGES</text></svg>