<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="1050" height="560" font-family="Arial, Helvetica, sans-serif"><title>BPMN US34 — Registar as minhas notas</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1050" height="560" fill="#fff"/><rect x="30" y="20" width="1000" height="520" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="540" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="540" stroke="#000" stroke-width="1.5"/><text transform="translate(45,280.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Registar as minhas notas (US34)</text><text transform="translate(75,140.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno (com sessão)</text><line x1="60" y1="260" x2="1030" y2="260" stroke="#000" stroke-width="1.5"/><text transform="translate(75,400.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="168,120 205,120" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="280,152 280,368" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="355,400 445,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="470,375 470,232" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="476" y="260" font-size="11" font-style="italic">não</text><polyline points="395,200 380,200 380,135 355,135" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="495,400 595,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="509" y="390" font-size="11" font-style="italic">sim</text><polyline points="745,400 870,400 870,138" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="120" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="150.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre «As minhas</text><text x="150" y="164.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">notas»</text><rect x="205.0" y="88.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="280" y="105.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Indicar a média do</text><text x="280" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">secundário e os exames</text><text x="280" y="135.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">que fez</text><rect x="205.0" y="368.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="280" y="385.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Validar: média de 9,5</text><text x="280" y="400.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">a 20; exames de 0 a</text><text x="280" y="415.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">200 ou de 0 a 20</text><polygon points="470,375 495,400 470,425 445,400" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="400" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="501" y="361.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Notas válidas?</text><rect x="395.0" y="168.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="192.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ver o erro junto ao</text><text x="470" y="207.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">campo e corrigir</text><rect x="595.0" y="368.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="670" y="385.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Converter valores em</text><text x="670" y="400.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">pontos e guardar no</text><text x="670" y="415.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">plano</text><circle cx="870" cy="120" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="896" y="113.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Vê o plano com as</text><text x="896" y="127.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">contas feitas</text></svg>