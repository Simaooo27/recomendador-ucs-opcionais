<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" width="1150" height="640" font-family="Arial, Helvetica, sans-serif"><title>BPMN US35 — Nota de candidatura a cada curso</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="640" fill="#fff"/><rect x="30" y="20" width="1100" height="600" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="620" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="620" stroke="#000" stroke-width="1.5"/><text transform="translate(45,320.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Nota de candidatura a cada curso (US35)</text><text transform="translate(75,120.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno (com sessão)</text><line x1="60" y1="220" x2="1130" y2="220" stroke="#000" stroke-width="1.5"/><text transform="translate(75,420.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="150,128 150,310 185,310" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="335,310 405,310" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="430,285 430,142" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="436" y="260" font-size="11" font-style="italic">não</text><polyline points="505,110 582,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="455,310 575,310" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="469" y="300" font-size="11" font-style="italic">sim</text><polyline points="600,335 600,488" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="606" y="360" font-size="11" font-style="italic">não</text><polyline points="675,520 802,520" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="625,310 705,310" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="639" y="300" font-size="11" font-style="italic">sim</text><polyline points="855,310 885,310" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="960,278 960,128" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="970" y="200" font-size="11" font-style="italic">acima, perto ou abaixo</text><circle cx="150" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="66.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre a ficha de</text><text x="150" y="80.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">um curso</text><rect x="185.0" y="278.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="260" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ler as notas do aluno</text><text x="260" y="310.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">e as condições do</text><text x="260" y="325.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">curso</text><polygon points="430,285 455,310 430,335 405,310" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="430" y="310" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="461" y="264.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Tem a média do</text><text x="461" y="278.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">secundário?</text><rect x="355.0" y="78.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="430" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ver o pedido para</text><text x="430" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">indicar as notas</text><text x="430" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">(US34)</text><polygon points="600,285 625,310 600,335 575,310" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="600" y="310" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="631" y="271.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Provas completas?</text><rect x="525.0" y="488.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="600" y="505.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Situação «falta</text><text x="600" y="520.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">prova», com a prova em</text><text x="600" y="535.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">falta</text><rect x="705.0" y="278.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="780" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Calcular a nota com</text><text x="780" y="310.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">cada conjunto e ficar</text><text x="780" y="325.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">com a melhor</text><rect x="885.0" y="278.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="960" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Comparar com os</text><text x="960" y="310.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">mínimos e o último</text><text x="960" y="325.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">colocado</text><circle cx="960" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="934" y="103.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Vê a nota e a situação</text><text x="934" y="117.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">(estimativa)</text><circle cx="820" cy="520" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="846" y="513.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Sabe que prova lhe</text><text x="846" y="527.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">falta</text><circle cx="600" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="626" y="110.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Indica as notas</text></svg>