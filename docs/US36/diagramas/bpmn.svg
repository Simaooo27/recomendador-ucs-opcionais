l" font-size="11" font-weight="400" fill="#000">candidatura no site da</text><text x="926" y="124.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">DGES</text><circle cx="150" cy="550" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="150" y="520.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Volta à ficha</text></svg>