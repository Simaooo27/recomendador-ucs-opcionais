<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Arial, Helvetica, sans-serif"><title>BPMN US37 — Assistente que conhece as minhas notas</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1200" height="700" fill="#fff"/><rect x="30" y="20" width="1150" height="660" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="680" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="680" stroke="#000" stroke-width="1.5"/><text transform="translate(45,350.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Assistente que conhece as minhas notas (US37)</text><text transform="translate(75,125.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno (com sessão)</text><line x1="60" y1="230" x2="1180" y2="230" stroke="#000" stroke-width="1.5"/><text transform="translate(75,365.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><line x1="60" y1="500" x2="1180" y2="500" stroke="#000" stroke-width="1.5"/><text transform="translate(75,590.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">LLM (Gemini)</text><polyline points="158,120 225,120" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="300,152 300,345" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="325,370 405,370" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="339" y="360" font-size="11" font-style="italic">sim</text><polyline points="555,370 595,370" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="745,370 860,370 860,558" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="300,395 300,590 785,590" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="306" y="440" font-size="11" font-style="italic">não</text><polyline points="935,590 1060,590 1060,402" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1060,338 1060,138" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="140" cy="120" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="140" y="62.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre a conversa</text><text x="140" y="76.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">(já indicou</text><text x="140" y="90.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">exames no plano)</text><rect x="225.0" y="88.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="300" y="105.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Marca a caixa (ou não)</text><text x="300" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">e carrega em «Começar</text><text x="300" y="135.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">a conversa»</text><polygon points="300,345 325,370 300,395 275,370" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="300" y="370" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="331" y="331.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Autorizou e tem exames?</text><rect x="405.0" y="338.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="480" y="355.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Tirar os cursos com</text><text x="480" y="370.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">prova em falta (se</text><text x="480" y="385.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">sobrarem 10 ou mais)</text><rect x="595.0" y="338.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="670" y="347.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Juntar às instruções</text><text x="670" y="362.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">os exames feitos e a</text><text x="670" y="377.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">média num intervalo de</text><text x="670" y="392.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">2 valores</text><rect x="785.0" y="558.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="860" y="582.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Pergunta ou sugere</text><text x="860" y="597.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">cursos</text><rect x="985.0" y="338.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1060" y="347.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Validar as sugestões</text><text x="1060" y="362.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">contra o catálogo e</text><text x="1060" y="377.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">assinalar provas em</text><text x="1060" y="392.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">falta</text><circle cx="1060" cy="120" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="1034" y="113.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Vê as perguntas e as</text><text x="1034" y="127.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">sugestões</text></svg>