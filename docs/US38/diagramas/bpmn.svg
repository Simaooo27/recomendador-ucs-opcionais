<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 600" width="1150" height="600" font-family="Arial, Helvetica, sans-serif"><title>BPMN US38 — Datas do concurso no percurso</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="600" fill="#fff"/><rect x="30" y="20" width="1100" height="560" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="580" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="580" stroke="#000" stroke-width="1.5"/><text transform="translate(45,300.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Datas do concurso no percurso (US38)</text><text transform="translate(75,135.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno (com sessão)</text><line x1="60" y1="250" x2="1130" y2="250" stroke="#000" stroke-width="1.5"/><text transform="translate(75,415.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="150,148 150,400 255,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="405,400 495,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="545,400 645,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="559" y="390" font-size="11" font-style="italic">sim</text><polyline points="520,425 520,488" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="462" font-size="11" font-style="italic">não</text><polyline points="720,368 720,130 845,130" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="595,520 920,520 920,162" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="995,130 1052,130" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="130" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="72.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre o início ou</text><text x="150" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">o plano de</text><text x="150" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">candidatura</text><rect x="255.0" y="368.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="330" y="385.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ler as datas do ano</text><text x="330" y="400.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">mais recente no</text><text x="330" y="415.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">ficheiro do calendário</text><polygon points="520,375 545,400 520,425 495,400" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="520" y="400" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="551" y="354.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Etapa a decorrer ou por</text><text x="551" y="368.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">vir?</text><rect x="645.0" y="368.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="720" y="377.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar o próximo</text><text x="720" y="392.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">prazo (a decorrer: até</text><text x="720" y="407.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">quando; por vir: as</text><text x="720" y="422.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">datas)</text><rect x="445.0" y="488.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="520" y="505.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Dizer que as datas do</text><text x="520" y="520.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">ano seguinte ainda não</text><text x="520" y="535.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">saíram</text><rect x="845.0" y="98.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="920" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Vê o prazo e, no</text><text x="920" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">plano, as 3 fases;</text><text x="920" y="145.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">abre a DGES se quiser</text><circle cx="1070" cy="130" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="1070" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Sabe o próximo</text><text x="1070" y="174.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">prazo</text></svg>