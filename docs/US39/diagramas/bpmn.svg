<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" width="1150" height="700" font-family="Arial, Helvetica, sans-serif"><title>BPMN US39 — Corrigir e esconder cursos do catálogo</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="700" fill="#fff"/><rect x="30" y="20" width="1100" height="660" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="680" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="680" stroke="#000" stroke-width="1.5"/><text transform="translate(45,350.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Corrigir e esconder cursos do catálogo (US39)</text><text transform="translate(75,130.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Administrador</text><line x1="60" y1="240" x2="1130" y2="240" stroke="#000" stroke-width="1.5"/><text transform="translate(75,370.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><line x1="60" y1="500" x2="1130" y2="500" stroke="#000" stroke-width="1.5"/><text transform="translate(75,590.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno ou visitante</text><polyline points="168,130 225,130" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="375,130 395,130" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="470,162 470,345" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="445,370 318,370" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="437" y="360" text-anchor="end" font-size="11" font-style="italic">não</text><polyline points="495,370 575,370" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="509" y="360" font-size="11" font-style="italic">sim</text><polyline points="725,370 765,370" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="840,402 840,558" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="915,590 992,590" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1030,148 1030,338" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="955,370 915,370" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="130" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre Gestão ›</text><text x="150" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Catálogo</text><rect x="225.0" y="98.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="300" y="122.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Procura o curso e</text><text x="300" y="137.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">abre-o</text><rect x="395.0" y="98.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Muda a descrição ou as</text><text x="470" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">saídas, ou marca</text><text x="470" y="145.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">«Esconder»; Guardar</text><polygon points="470,345 495,370 470,395 445,370" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="370" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="501" y="331.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Mudou alguma coisa?</text><circle cx="300" cy="370" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="300" y="400.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">«Nada mudou»</text><rect x="575.0" y="338.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="650" y="355.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Guardar a correção por</text><text x="650" y="370.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">cima da DGES e</text><text x="650" y="385.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">registar quem e quando</text><rect x="765.0" y="338.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="840" y="347.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">O catálogo da</text><text x="840" y="362.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">aplicação passa a usar</text><text x="840" y="377.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">a correção (escondido:</text><text x="840" y="392.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">sai)</text><rect x="765.0" y="558.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="840" y="582.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Vê o curso corrigido,</text><text x="840" y="597.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">ou deixa de o ver</text><circle cx="1010" cy="590" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="1010" y="620.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Catálogo</text><text x="1010" y="634.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">corrigido</text><circle cx="1030" cy="130" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1030" y="72.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Carrega em</text><text x="1030" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">«Repor os dados</text><text x="1030" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">da DGES»</text><rect x="955.0" y="338.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1030" y="362.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Apagar a correção e</text><text x="1030" y="377.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">registar</text></svg>