<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" width="1150" height="640" font-family="Arial, Helvetica, sans-serif"><title>BPMN US40 — Quanto preciso no exame?</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="640" fill="#fff"/><rect x="30" y="20" width="1100" height="600" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="620" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="620" stroke="#000" stroke-width="1.5"/><text transform="translate(45,320.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Quanto preciso no exame? (US40)</text><text transform="translate(75,120.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno (com sessão)</text><line x1="60" y1="220" x2="1130" y2="220" stroke="#000" stroke-width="1.5"/><text transform="translate(75,420.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="150,128 150,330 195,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="345,330 405,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="430,355 430,482" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="436" y="400" font-size="11" font-style="italic">não</text><polyline points="455,330 515,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="469" y="320" font-size="11" font-style="italic">sim</text><polyline points="665,330 695,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="845,330 875,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="950,362 950,455" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="975,480 1070,480 1070,128" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="1076" y="300" font-size="11" font-style="italic">sim</text><polyline points="950,505 950,545 835,545" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="956" y="525" font-size="11" font-style="italic">não</text><polyline points="685,545 608,545" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre a ficha de</text><text x="150" y="66.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">um curso (ou o</text><text x="150" y="80.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">plano)</text><rect x="195.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="270" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ler a média, os exames</text><text x="270" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">feitos e as condições</text><text x="270" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">do curso</text><polygon points="430,305 455,330 430,355 405,330" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="430" y="330" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="461" y="284.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Tem média e falta alguma</text><text x="461" y="298.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">prova?</text><circle cx="430" cy="500" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="430" y="530.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Só a nota (US35)</text><rect x="515.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="590" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Alvo: último colocado</text><text x="590" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">(ou nota mínima do</text><text x="590" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">curso)</text><rect x="695.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="770" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Em cada conjunto, nota</text><text x="770" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">precisa nas provas em</text><text x="770" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">falta, com o mínimo</text><rect x="875.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="950" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ficar com o conjunto</text><text x="950" y="337.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">em que é mais fácil</text><polygon points="950,455 975,480 950,505 925,480" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="950" y="480" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="981" y="441.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Chega com 200 ou menos?</text><rect x="685.0" y="513.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="760" y="530.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Dizer que nem 200</text><text x="760" y="545.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">chegam e a nota máxima</text><text x="760" y="560.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">possível</text><circle cx="1070" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="1044" y="110.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Vê «precisa de X em Y»</text><circle cx="590" cy="545" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="590" y="575.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Sabe que não</text><text x="590" y="589.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">chega</text></svg>