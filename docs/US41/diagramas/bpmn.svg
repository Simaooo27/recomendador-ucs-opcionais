<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="1050" height="560" font-family="Arial, Helvetica, sans-serif"><title>BPMN US41 — Tendência do último colocado</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1050" height="560" fill="#fff"/><rect x="30" y="20" width="1000" height="520" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="540" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="540" stroke="#000" stroke-width="1.5"/><text transform="translate(45,280.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Tendência do último colocado (US41)</text><text transform="translate(75,120.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Pessoa</text><line x1="60" y1="220" x2="1030" y2="220" stroke="#000" stroke-width="1.5"/><text transform="translate(75,380.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="150,128 150,330 195,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="345,330 415,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="440,355 440,438" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="446" y="400" font-size="11" font-style="italic">não</text><polyline points="515,470 602,470" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="465,330 545,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="479" y="320" font-size="11" font-style="italic">sim</text><polyline points="695,330 725,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="875,330 940,330 940,128" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre a ficha de</text><text x="150" y="66.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">um curso (ou o</text><text x="150" y="80.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">plano)</text><rect x="195.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="270" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ler o último colocado</text><text x="270" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">da 1.ª fase de 2023,</text><text x="270" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">2024 e 2025</text><polygon points="440,305 465,330 440,355 415,330" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="440" y="330" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="471" y="291.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Há 2 ou mais anos?</text><rect x="365.0" y="438.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="440" y="462.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar só a nota de</text><text x="440" y="477.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">2025</text><rect x="545.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="620" y="307.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Comparar o ano mais</text><text x="620" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">recente com o mais</text><text x="620" y="337.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">antigo (3 pontos de</text><text x="620" y="352.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">margem)</text><rect x="725.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="800" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar os anos e «A</text><text x="800" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">subir», «A descer» ou</text><text x="800" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">«Estável»</text><circle cx="940" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="914" y="103.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Percebe se está mais</text><text x="914" y="117.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">difícil entrar</text><circle cx="620" cy="470" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="646" y="470.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Sem tendência</text></svg>