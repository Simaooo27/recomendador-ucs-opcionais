x="566" y="400" font-size="11" font-style="italic">não</text><polyline points="815,250 880,250 880,298" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="815,450 880,450 880,362" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="955,330 980,330 980,110 898,110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="66.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre a ficha de</text><text x="150" y="80.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">um curso</text><rect x="195.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="270" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ler vagas, candidatos,</text><text x="270" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">1.ª opção e colocados</text><text x="270" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">de 2025</text><polygon points="430,305 455,330 430,355 405,330" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="430" y="330" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="461" y="291.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Há dados?</text><circle cx="430" cy="480" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="456" y="480.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Sem etiqueta</text><polygon points="560,305 585,330 560,355 535,330" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="560" y="330" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="591" y="291.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Sobraram vagas?</text><rect x="665.0" y="218.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="740" y="242.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Etiqueta «Sobraram</text><text x="740" y="257.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">vagas na 1.ª fase»</text><rect x="665.0" y="418.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="740" y="427.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Candidatos em 1.ª</text><text x="740" y="442.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">opção por vaga: muito</text><text x="740" y="457.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">procurado, procurado</text><text x="740" y="472.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">ou pouco escolhido</text><rect x="805.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="880" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar a etiqueta e</text><text x="880" y="337.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">os números</text><circle cx="880" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="854" y="103.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Percebe o risco da</text><text x="854" y="117.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">escolha</text></svg>