<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" width="1150" height="700" font-family="Arial, Helvetica, sans-serif"><title>BPMN US43 — Partilhar o plano</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="700" fill="#fff"/><rect x="30" y="20" width="1100" height="660" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="680" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="680" stroke="#000" stroke-width="1.5"/><text transform="translate(45,350.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Partilhar o plano (US43)</text><text transform="translate(75,125.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno (com sessão)</text><line x1="60" y1="230" x2="1130" y2="230" stroke="#000" stroke-width="1.5"/><text transform="translate(75,355.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><line x1="60" y1="480" x2="1130" y2="480" stroke="#000" stroke-width="1.5"/><text transform="translate(75,580.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Quem recebe a ligação</text><polyline points="150,118 150,350 195,350" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="270,318 270,120 355,120" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="430,152 430,548" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="505,580 540,580 540,350 575,350" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="625,350 715,350" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="639" y="340" font-size="11" font-style="italic">sim</text><polyline points="600,375 600,562" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="606" y="420" font-size="11" font-style="italic">não</text><polyline points="790,382 790,562" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="778,100 855,100" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1005,100 1042,100" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="100" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Carrega em</text><text x="150" y="56.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">«Criar ligação</text><text x="150" y="70.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">de partilha»</text><rect x="195.0" y="318.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="270" y="327.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Criar um código</text><text x="270" y="342.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">aleatório (ou</text><text x="270" y="357.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">reutilizar o que</text><text x="270" y="372.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">existe)</text><rect x="355.0" y="88.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="430" y="112.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Copiar a ligação e</text><text x="430" y="127.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">enviá-la</text><rect x="355.0" y="548.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="430" y="572.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Abre a ligação, sem</text><text x="430" y="587.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">iniciar sessão</text><polygon points="600,325 625,350 600,375 575,350" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="600" y="350" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="631" y="311.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Código válido?</text><rect x="715.0" y="318.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="790" y="327.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar nome, opções,</text><text x="790" y="342.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">nota e situação; sem</text><text x="790" y="357.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">email, média nem</text><text x="790" y="372.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">exames</text><circle cx="790" cy="580" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="816" y="580.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Vê o plano</text><circle cx="600" cy="580" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="626" y="580.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Página não encontrada</text><circle cx="760" cy="100" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="760" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Carrega em</text><text x="760" y="56.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">«Deixar de</text><text x="760" y="70.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">partilhar»</text><rect x="855.0" y="68.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="930" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Apagar o código</text><circle cx="1060" cy="100" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="1060" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">A ligação deixa</text><text x="1060" y="144.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">de funcionar</text></svg>