<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 600" width="1150" height="600" font-family="Arial, Helvetica, sans-serif"><title>BPMN US44 — Que exames me abrem mais portas?</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="600" fill="#fff"/><rect x="30" y="20" width="1100" height="560" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="580" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="580" stroke="#000" stroke-width="1.5"/><text transform="translate(45,300.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Que exames me abrem mais portas? (US44)</text><text transform="translate(75,120.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno (com sessão)</text><line x1="60" y1="220" x2="1130" y2="220" stroke="#000" stroke-width="1.5"/><text transform="translate(75,400.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="150,128 150,330 195,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="345,330 415,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="440,355 440,472" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="446" y="400" font-size="11" font-style="italic">não</text><polyline points="465,330 535,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="479" y="320" font-size="11" font-style="italic">sim</text><polyline points="685,330 715,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="865,330 895,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="970,298 970,128" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="66.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre o plano de</text><text x="150" y="80.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">candidatura</text><rect x="195.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="270" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Juntar os conjuntos de</text><text x="270" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">provas das opções com</text><text x="270" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">condições</text><polygon points="440,305 465,330 440,355 415,330" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="440" y="330" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="471" y="291.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">2 ou mais opções?</text><circle cx="440" cy="490" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="466" y="490.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">A secção não aparece</text><rect x="535.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="610" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Experimentar</text><text x="610" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">combinações de 1 a 3</text><text x="610" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">exames</text><rect x="715.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="790" y="307.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Ficar com as mínimas;</text><text x="790" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">ordenar por opções,</text><text x="790" y="337.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">n.º de exames e exames</text><text x="790" y="352.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">feitos</text><rect x="895.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="970" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar as 3 melhores,</text><text x="970" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">para que opções não</text><text x="970" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">dão e o que já fez</text><circle cx="970" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="944" y="103.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Decide que exames</text><text x="944" y="117.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">fazer</text></svg>