ominant-baseline="central" font-size="16" font-weight="700">×</text><text x="691" y="284.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Algum a que a nota</text><text x="691" y="298.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">chegava?</text><rect x="785.0" y="298.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="860" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar até 3, os mais</text><text x="860" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">disputados primeiro,</text><text x="860" y="345.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">com o aviso das vagas</text><rect x="585.0" y="488.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="660" y="512.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Explicar porque ainda</text><text x="660" y="527.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">não há plano B</text><circle cx="860" cy="110" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="834" y="103.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Tem uma alternativa</text><text x="834" y="117.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">para a 2.ª fase</text><circle cx="860" cy="520" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="886" y="520.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Sabe que não há</text></svg>