<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="1150" height="560" font-family="Arial, Helvetica, sans-serif"><title>BPMN US46 — Exportar os meus dados</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1150" height="560" fill="#fff"/><rect x="30" y="20" width="1100" height="520" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="540" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="540" stroke="#000" stroke-width="1.5"/><text transform="translate(45,280.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Exportar os meus dados (US46)</text><text transform="translate(75,140.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Aluno (com sessão)</text><line x1="60" y1="260" x2="1130" y2="260" stroke="#000" stroke-width="1.5"/><text transform="translate(75,400.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="168,140 245,140" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="320,172 320,400 475,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="525,400 625,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="539" y="390" font-size="11" font-style="italic">sim</text><polyline points="500,375 500,158" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="506" y="320" font-size="11" font-style="italic">não</text><polyline points="775,400 825,400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="900,368 900,140 1042,140" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="140" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="68.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Abre</text><text x="150" y="82.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">«Descarregar os</text><text x="150" y="96.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">meus dados» em</text><text x="150" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">«A minha conta»</text><rect x="245.0" y="108.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="320" y="117.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Escreve a</text><text x="320" y="132.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">palavra-passe e</text><text x="320" y="147.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">carrega em</text><text x="320" y="162.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">«Descarregar»</text><polygon points="500,375 525,400 500,425 475,400" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="500" y="400" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="531" y="361.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Palavra-passe certa?</text><circle cx="500" cy="140" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="500" y="96.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Vê o erro; nada</text><text x="500" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">é descarregado</text><rect x="625.0" y="368.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="700" y="377.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Juntar conta,</text><text x="700" y="392.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">decisões, plano,</text><text x="700" y="407.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">conversa e pedidos, só</text><text x="700" y="422.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">deste aluno</text><rect x="825.0" y="368.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="900" y="377.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Devolver um ficheiro</text><text x="900" y="392.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">JSON, sem</text><text x="900" y="407.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">palavra-passe nem</text><text x="900" y="422.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">código de partilha</text><circle cx="1060" cy="140" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="1060" y="170.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Recebe o</text><text x="1060" y="184.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">ficheiro</text></svg>