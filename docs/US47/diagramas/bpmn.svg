<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 700" width="1260" height="700" font-family="Arial, Helvetica, sans-serif"><title>BPMN US47 — Recuperar a palavra-passe</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1260" height="700" fill="#fff"/><rect x="30" y="20" width="1210" height="660" fill="none" stroke="#000" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="680" stroke="#000" stroke-width="2"/><line x1="90" y1="20" x2="90" y2="680" stroke="#000" stroke-width="1.5"/><text transform="translate(45,350.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700">Recuperar a palavra-passe (US47)</text><text transform="translate(75,135.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Pessoa sem sessão</text><line x1="60" y1="250" x2="1240" y2="250" stroke="#000" stroke-width="1.5"/><text transform="translate(75,465.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700">Sistema (OptaBem)</text><polyline points="168,140 225,140" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="300,172 300,380 395,380" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="445,380 525,380" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="459" y="370" font-size="11" font-style="italic">sim</text><polyline points="420,405 420,470 790,470 790,412" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="426" y="445" font-size="11" font-style="italic">não</text><polyline points="675,380 715,380" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="790,348 790,172" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="865,140 960,140 960,355" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="985,380 1075,380" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="999" y="370" font-size="11" font-style="italic">sim</text><polyline points="960,405 960,572" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="966" y="460" font-size="11" font-style="italic">não</text><polyline points="1150,412 1150,572" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><circle cx="150" cy="140" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="150" y="96.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Esqueceu-se da</text><text x="150" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">palavra-passe</text><rect x="225.0" y="108.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="300" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Escreve o email e</text><text x="300" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">carrega em «Enviar a</text><text x="300" y="155.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">ligação»</text><polygon points="420,355 445,380 420,405 395,380" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="420" y="380" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="451" y="334.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Conta ativa com esse</text><text x="451" y="348.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">email?</text><rect x="525.0" y="348.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="600" y="365.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Criar ligação de uso</text><text x="600" y="380.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">único, válida 1 hora,</text><text x="600" y="395.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">e enviá-la por email</text><rect x="715.0" y="348.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="790" y="365.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mostrar «Veja o seu</text><text x="790" y="380.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">email» (igual nos dois</text><text x="790" y="395.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">casos)</text><rect x="715.0" y="108.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="790" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Abre a ligação do</text><text x="790" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">email e escolhe a</text><text x="790" y="155.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">palavra-passe nova</text><polygon points="960,355 985,380 960,405 935,380" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="960" y="380" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">×</text><text x="991" y="334.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Ligação e palavra-passe</text><text x="991" y="348.0" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">válidas?</text><rect x="1075.0" y="348.0" width="150" height="64" rx="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1150" y="357.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">Mudar a palavra-passe;</text><text x="1150" y="372.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">a ligação deixa de</text><text x="1150" y="387.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">servir e as sessões</text><text x="1150" y="402.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#000">terminam</text><circle cx="1150" cy="590" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="1124" y="583.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Inicia sessão com a</text><text x="1124" y="597.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">nova</text><circle cx="960" cy="590" r="18" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="934" y="576.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">Erro: expirada, já</text><text x="934" y="590.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">usada ou palavra-passe</text><text x="934" y="604.0" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#000">fraca</text></svg>