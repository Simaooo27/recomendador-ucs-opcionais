<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, Helvetica, sans-serif">
<title>Diagrama de use case — US01 Registo com email institucional</title>
<desc>O aluno regista a conta e confirma o email. Registar inclui validar os dados e enviar o email de confirmação; confirmar inclui validar a ligação. O serviço de email participa no envio.</desc>
